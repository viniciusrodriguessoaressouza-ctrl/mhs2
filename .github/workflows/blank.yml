
name: Build MH Stories 2 Mod Tool APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT_DIR=$(find source -type f \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Gradle nao encontrado."
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Configure Java and Kotlin targets
        shell: bash
        run: |
          set -e
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "Arquivo app/build.gradle.kts não encontrado."
            find "$PROJECT_DIR" -maxdepth 4 -name "build.gradle*"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)
          print("Configuração verificada:", p)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Stories-2-Mod-Tool-APK
          path: |
            source/**/build/outputs/apk/debug/*.apk
            source/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
