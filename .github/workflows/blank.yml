
name: Build MH Stories 2 Mod Tool APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado."
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT_DIR=$(find source -type f \
            -name settings.gradle.kts \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Gradle nao encontrado."
            find source -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    log-accepted-android-sdk-licenses: false
    
- name: Install Android SDK components
  run: |
    sdkmanager --install \
      "platform-tools" \
      "platforms;android-35" \
      "build-tools;35.0.0"

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Stories-2-Mod-Tool-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
